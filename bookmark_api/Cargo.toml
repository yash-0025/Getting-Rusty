[package]
name = "bookmark_api"
version = "0.1.0"
edition = "2024"


[dependencies]
axum = "0.7"
tokio = { version = "1.0" , features = ["full"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

sqlx = { version = "0.7" , features = ["runtime-tokio-native-tls", "sqlite", "macros"] }

tower-http = { version = "0.5", features = ["cors", "trace"] }